server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: ${gateway.services.auth-url:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: job-service-route
          uri: ${gateway.services.job-url:http://localhost:8082}
          predicates:
            - Path=/api/v1/jobs/**

gateway:
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    job-url: ${JOB_SERVICE_URL:http://localhost:8082}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
