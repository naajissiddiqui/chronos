server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: ${gateway.services.auth-url:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "${gateway.cors.allowed-origins:http://localhost:3000}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true

gateway:
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
