server:
  port: ${PORT:8083}

spring:
  profiles:
    active: local

  application:
    name: scheduler-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chronos_job}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:chronos-scheduler-test-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true


scheduler:
  polling-interval-ms: 5000
  lock:
    key: ${SCHEDULER_LOCK_KEY:scheduler:lock}
    ttl-seconds: ${SCHEDULER_LOCK_TTL_SECONDS:10}


outbox:
  publisher:
    interval-ms: 1000

kafka:
  topics:
    job-triggered: job.triggered

