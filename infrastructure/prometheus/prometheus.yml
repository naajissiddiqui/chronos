global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'chronos-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080' # gateway-service
          - 'host.docker.internal:8081' # auth-service
          - 'host.docker.internal:8082' # job-service
          - 'host.docker.internal:8083' # scheduler-service
          - 'host.docker.internal:8084' # execution-service
          - 'host.docker.internal:8085' # worker-service
        labels:
          environment: 'development'
